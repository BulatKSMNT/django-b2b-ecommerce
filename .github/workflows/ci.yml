name: Backend CI

on:
  push:
    branches: [ "main", "master", "backend-api" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-django:
    name: Django Tests
    runs-on: ubuntu-latest
    
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-12345
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_ENGINE: sqlite  # Используем SQLite для скорости CI-тестов

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Checks
        run: python manage.py check

      - name: Run Django Tests
        run: python manage.py test

  test-fastapi:
    name: FastAPI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/lead_scoring_api/requirements.txt

      - name: Run Pytest
        run: |
          cd services/lead_scoring_api
          pytest
