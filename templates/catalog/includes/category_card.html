<a href="{{ category.get_absolute_url }}" class="group relative bg-surface-container-lowest rounded-xl overflow-hidden transition-all duration-500 hover:-translate-y-2 shadow-sm border border-outline-variant/10 h-56 md:h-72 flex">

    <div class="absolute inset-0 bg-surface-container overflow-hidden">
        {% if category.image %}
            <img src="{{ category.image.url }}" alt="{{ category.name }}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
        {% else %}
            <div class="w-full h-full flex items-center justify-center text-on-surface-variant/30 bg-surface-container-low">
                <span class="material-symbols-outlined text-6xl">inventory_2</span>
            </div>
        {% endif %}
    </div>

    <!-- Градиентная подложка -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-80 group-hover:opacity-90 transition-opacity"></div>

    <div class="absolute bottom-0 left-0 w-full p-6 flex flex-col z-10">
        <h3 class="text-white text-xl md:text-2xl font-bold mb-1 group-hover:text-primary-fixed transition-colors">{{ category.name }}</h3>

        {% if category.description %}
            <p class="text-white/70 text-sm opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-4 group-hover:translate-y-0 line-clamp-2">
                {{ category.description }}
            </p>
        {% endif %}
    </div>

    <!-- Иконка стрелки -->
    <div class="absolute top-4 right-4 text-white bg-primary/80 backdrop-blur-md w-10 h-10 rounded-full scale-0 group-hover:scale-100 transition-transform duration-300 flex items-center justify-center z-10">
        <span class="material-symbols-outlined">arrow_outward</span>
    </div>
</a>
