{% extends 'base.html' %}
{% block title %}Пароль обновлён | LIDER{% endblock %}

{% block content %}
<div class="relative min-h-[calc(100vh-80px)] flex flex-col items-center justify-center p-4 overflow-hidden bg-surface">
    <div class="w-full max-w-[480px] bg-surface-container-lowest p-8 md:p-12 rounded-[2rem] shadow-2xl shadow-on-surface/5 border border-outline-variant/15 text-center relative z-10">

        <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-secondary-container/30 flex items-center justify-center text-secondary">
            <span class="material-symbols-outlined text-5xl">check_circle</span>
        </div>

        <h1 class="text-3xl font-black tracking-tighter text-on-surface mb-4">Пароль обновлён</h1>
        <p class="text-on-surface-variant text-sm leading-relaxed mb-8">
            Отлично! Ваш пароль был успешно изменен. Теперь вы можете войти в свой аккаунт.
        </p>

        <a href="{% url 'login' %}" class="w-full inline-flex justify-center items-center gap-2 bg-primary hover:bg-primary-fixed-dim text-on-primary font-bold py-4 rounded-xl transition-all duration-300 active:scale-95 shadow-lg shadow-primary/20 uppercase tracking-wide text-sm">
            Перейти ко входу <span class="material-symbols-outlined text-lg">login</span>
        </a>
    </div>
</div>
{% endblock %}
