<dialog id="action-dialog" class="crm-dialog" aria-labelledby="dialog-title">
    <form id="action-form">
        <div class="flex justify-between items-start gap-4 mb-5">
            <h2 id="dialog-title"></h2>

            <button
                type="button"
                class="icon-button"
                data-dialog-close
                aria-label="Закрыть диалог"
            >
                <span class="material-symbols-outlined" aria-hidden="true">
                    close
                </span>
            </button>
        </div>

        <div id="dialog-fields" class="space-y-4"></div>

        <p id="dialog-hint" class="notice mt-4"></p>

        <p
            id="dialog-error"
            class="text-sm text-red-700 mt-4"
            role="alert"
            hidden
        ></p>

        <div class="flex justify-end gap-3 border-t border-line pt-5 mt-6">
            <button type="button" class="btn btn-secondary" data-dialog-close>
                Отмена
            </button>
            <button id="dialog-submit" type="submit" class="btn btn-primary">
                Сохранить
            </button>
        </div>
    </form>
</dialog>
