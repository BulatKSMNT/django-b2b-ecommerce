<form method="post" action="{% url 'shop:favorite_toggle' product.id %}" class="shop-inline-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit">
        {% if favorite_product_ids and product.id in favorite_product_ids %}
            Убрать из избранного
        {% else %}
            В избранное
        {% endif %}
    </button>
</form>
