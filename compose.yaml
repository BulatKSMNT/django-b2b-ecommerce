services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-b2b-ecommerce-web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev-network

  db:
    image: postgres:17-alpine
    container_name: django-b2b-ecommerce-db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
    - "5433:5432"
    volumes:
      - django_b2b_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_b2b -d django_b2b"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev-network

volumes:
  django_b2b_postgres_data:

networks:
  dev-network:
    external: true
